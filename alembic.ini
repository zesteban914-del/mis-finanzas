# Configuración de Alembic (migraciones de la base de datos).
# La URL de la base se toma de app/database.py (variable DATABASE_URL).
#
# Comandos útiles:
#   alembic upgrade head                       aplica las migraciones pendientes
#   alembic revision -m "descripcion"          crea una migración nueva
#   alembic history                            lista las migraciones
# La aplicación también aplica las migraciones pendientes al arrancar.

[alembic]
script_location = migraciones
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
