<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Finanzas · Control de gastos</title>
  <meta name="description" content="Finanzas para personas y negocios: ingresos, gastos, presupuestos, metas, cajas y equipo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233987e5'/%3E%3Cstop offset='1' stop-color='%231c5cab'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 20l5-5 3 3 6-7' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/css/estilos.css">
  <script>
    try {
      var temaGuardado = localStorage.getItem("tema");
      if (temaGuardado) document.documentElement.dataset.theme = temaGuardado;
    } catch (e) {}
  </script>
</head>
<body>
  <main id="autenticacion" class="autenticacion" hidden></main>

  <div class="app" hidden>
    <header class="cabecera-movil">
      <a class="marca" href="#/">
        <span class="marca-logo" data-icono="tendencia"></span>
        <strong>Mis Finanzas</strong>
      </a>
      <div class="cabecera-movil-acciones">
        <button type="button" class="boton-icono js-tema"></button>
        <button type="button" class="boton-icono js-salir" aria-label="Cerrar sesión" title="Cerrar sesión" data-icono="salir"></button>
      </div>
    </header>

    <aside class="barra-lateral">
      <a class="marca" href="#/">
        <span class="marca-logo" data-icono="tendencia"></span>
        <span class="marca-texto">
          <strong>Mis Finanzas</strong>
          <small id="marca-subtitulo">Control de gastos</small>
        </span>
      </a>

      <!-- Cada enlace declara qué necesita: data-permiso, data-funcion o data-admin.
           app.js oculta los que el usuario no puede usar (la API igual lo verifica). -->
      <nav class="navegacion" aria-label="Secciones">
        <div class="grupo-nav">
          <span class="navegacion-titulo">General</span>
          <a href="#/panel" data-vista="panel" data-icono="panel" data-permiso="VER_REPORTES"><span>Panel</span></a>
          <a href="#/movimientos" data-vista="movimientos" data-icono="movimientos" data-permiso="VER_MOVIMIENTOS"><span>Movimientos</span></a>
        </div>
        <div class="grupo-nav">
          <span class="navegacion-titulo">Planeación</span>
          <a href="#/presupuestos" data-vista="presupuestos" data-icono="objetivo" data-permiso="VER_REPORTES"><span>Presupuestos</span></a>
          <a href="#/recurrentes" data-vista="recurrentes" data-icono="repetir" data-permiso="VER_REPORTES"><span>Recurrentes</span></a>
          <a href="#/metas" data-vista="metas" data-icono="alcancia" data-permiso="VER_REPORTES" data-funcion="METAS"><span>Metas de ahorro</span></a>
        </div>
        <div class="grupo-nav">
          <span class="navegacion-titulo">Organización</span>
          <a href="#/categorias" data-vista="categorias" data-icono="etiqueta" data-permiso="VER_REPORTES"><span>Categorías</span></a>
          <a href="#/cajas" data-vista="cajas" data-icono="billetera" data-permiso="VER_REPORTES" data-funcion="CAJAS"><span>Cajas</span></a>
          <a href="#/deudas" data-vista="deudas" data-icono="documento" data-permiso="VER_REPORTES"><span id="nav-deudas">Deudas</span></a>
          <a href="#/equipo" data-vista="equipo" data-icono="usuarios" data-permiso="GESTIONAR_EQUIPO" data-funcion="EQUIPO"><span>Equipo</span></a>
        </div>
        <div class="grupo-nav">
          <span class="navegacion-titulo">Cuenta</span>
          <a href="#/cuenta" data-vista="cuenta" data-icono="ajustes"><span>Mi cuenta y plan</span></a>
          <a href="#/administracion" data-vista="administracion" data-icono="escudo" data-admin><span>Usuarios</span></a>
        </div>
      </nav>

      <div class="barra-pie">
        <button type="button" class="boton-lateral js-tema"></button>
        <a class="boton-lateral" href="/docs" target="_blank" rel="noopener" data-icono="externo"><span>Documentación API</span></a>
        <div class="tarjeta-usuario">
          <span class="avatar" id="usuario-avatar" aria-hidden="true"></span>
          <span class="tarjeta-usuario-datos">
            <strong id="usuario-nombre"></strong>
            <small id="usuario-detalle"></small>
          </span>
          <button type="button" class="boton-icono js-salir" aria-label="Cerrar sesión" title="Cerrar sesión" data-icono="salir"></button>
        </div>
      </div>
    </aside>

    <main class="contenido" id="contenido"></main>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="notificaciones" class="notificaciones" aria-live="polite"></div>
  <dialog id="dialogo" class="dialogo"></dialog>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
