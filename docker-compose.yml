services:
  db:
    image: postgres:16
    container_name: control_gastos_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_gastos
    ports:
      - "5434:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_gastos"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  datos_postgres:
